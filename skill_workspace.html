else{const im=selected(),records=historyTab==='project'?state.records:state.records.filter(x=>x.sourceId===im?.id||x.resultId===im?.id);head=`<div class="row between"><div><div class="eyebrow">IMAGE HISTORY</div><h2>创作历史</h2></div><button class="icon" data-act="closeDrawer" aria-label="关闭历史">${icon('close')}</button></div><small>${esc(im?.name||'尚未选择图片')}</small><div class="history-tabs"><button data-act="historyTab" data-value="image" class="${historyTab==='image'?'active':''}">当前图片</button><button data-act="historyTab" data-value="project" class="${historyTab==='project'?'active':''}">整个项目</button></div>`;body=records.length?records.slice().reverse().map(r=>`<div class="history-item"><div class="row between"><b>${SKILLS[r.skill].name}</b><small>${esc(r.time)}</small></div><p>${esc(r.sourceName)} → ${esc(r.resultName)}</p><img src="${r.preview}" alt="历史草稿"><p>${summary(r.config,r.skill)}${r.config.note?' · '+esc(r.config.note):''}</p><div class="row"><button data-act="restore" data-id="${r.id}">恢复这次操作</button><button data-act="locate" data-id="${r.resultId}">定位结果</button></div></div>`).join(''):'<div class="empty">还没有已采用的操作<br><small>采用候选后，来源、能力与设置会出现在这里</small></div>'}

function renderAssistant(){const s=session,im=s?source():selected();$('#assistantHost').innerHTML=`<section class="assistant">${assistantOpen?`<div class="assistant-head">${icon('spark')}<div class="grow"><h3>创作助手</h3><small>${s?'已带入图片、能力与当前设置':'围绕当前图片继续讨论'}</small></div><button class="icon" data-act="chatHistory" title="对话历史">${icon('history')}</button><button class="icon" data-act="toggleAssistant" aria-label="收起助手">${icon('chevron')}</button></div><div class="assistant-context">${im?`<span class="chip">${esc(im.name)}</span>`:''}${s?`<span class="chip sand">${SKILLS[s.skill].name} · ${s.scope==='region'?'局部':'整图'}</span>`:''}</div><div class="assistant-body" id="chatScroll">${messages.length?messages.map(m=>`<div class="message ${m.role==='user'?'user':''}">${esc(m.text)}</div>`).join(''):'<div class="message">图片和已确认意图已带入。可以告诉我“更舒展一些”或“让光线更暖”，也可以直接在工作台中调整。</div>'}${proposal?`<div class="suggestion"><b>建议调整 · ${SKILLS[proposal.skill].name}</b><p style="margin-top:5px">${esc(proposal.text)}</p><small>作用于 ${esc(state.images.find(x=>x.id===proposal.sourceId)?.name)}；确认后更新工作台</small><br><button class="primary" data-act="applyProposal">确认并更新工作台</button><button class="secondary" data-act="discardProposal">暂不采用</button></div>`:''}</div>`:''}<div class="composer"><button class="icon" data-act="toggleAssistant" title="${assistantOpen?'收起助手':'展开助手'}" aria-label="展开或收起助手">${icon('spark')}</button><input id="chatInput" placeholder="${s?'对这张图和当前能力补充一句…':'描述想画的、想改的…'}" aria-label="向助手输入意图"><button class="icon" data-act="voiceChat" title="语音输入" aria-label="语音输入">${icon('mic')}</button><button class="icon send" data-act="sendChat" aria-label="发送">${icon('send')}</button></div></section>`;const scroll=$('#chatScroll');if(scroll)scroll.scrollTop=scroll.scrollHeight}

function setDirection(i){const c=session.config;c.direction=i;if(session.skill==='composition'){c.space=[30,78,58][i];c.motion=['对角线','水平','环形'][i];const layouts=[[[36,58],[49,47],[61,62],[78,30]],[[20,62],[46,48],[76,63],[88,29]],[[27,61],[48,43],[69,61],[83,32]]];c.positions=layouts[i].map(([x,y])=>({x,y}));c.focus=[48,50,47][i]}else if(session.skill==='color'){c.warmth=[72,24,89][i];c.light=[70,44,57][i]}else c.texture=[16,85,58][i];syncMount();renderPanel()}
